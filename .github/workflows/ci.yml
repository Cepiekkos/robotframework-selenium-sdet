name: SDET Test Automation CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ui-automation:
    name: Execute Robot Framework UI & AI Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies & Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip
          google-chrome --version || (wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add - && sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list' && sudo apt-get update && sudo apt-get install -y google-chrome-stable)

      - name: Install Python Automation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Robot Framework Automated Tests
        run: |
          python run_tests.py --browser headlesschrome --outputdir reports

      - name: Publish Test Execution Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-reports
          path: |
            reports/
            baselines/
          retention-days: 14
